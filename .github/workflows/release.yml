name: Build & publish frontend

# Builds and publishes only on `v*` tags and manual dispatch. A tag means
# dashboard-relevant changes that need a rebuild for Docker Compose to pick
# up; plain main pushes (UI-only changes) never trigger a rebuild.
# **No runtime values** — API_URL / API_KEY are never baked in (server code
# reads them from process.env at request time). Compose downloads the
# versioned asset and injects env at runtime:
#
#   https://github.com/muizzyranking/flint-ui/releases/download/v0.2.0/flint-frontend.tar.gz
#   node server.js   (PORT=3000, API_URL=http://api:8000/api/v1, API_KEY=…)
#

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (env-free)
        run: pnpm build

      - name: Package standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p dist
          tar --exclude='._*' -czf dist/flint-frontend.tar.gz -C .next/standalone .

      - name: Collect tag notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          git tag -l --format='%(contents)body' "$GITHUB_REF_NAME" \
            > dist/tag-notes.md
          if [ ! -s dist/tag-notes.md ]; then
            echo "Tagged build of the flint frontend." > dist/tag-notes.md
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes >/dev/null 2>&1 || true
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --latest --title "Flint frontend $GITHUB_REF_NAME" \
            --notes-file dist/tag-notes.md dist/flint-frontend.tar.gz
